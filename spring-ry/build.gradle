plugins {
    id 'java'
}

group 'org.springframework'
version '5.2.26.BUILD-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    compile(project(":spring-context"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
//    compile "org.aspectj:aspectjrt:1.9.7"
    compile "org.springframework:spring-aop:1.9.7"
    compile "org.aspectj:aspectjweaver:1.9.7"
//    compile 'gradle.plugin.aspectj:gradle-aspectj:0.1.6'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
//    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'
    // https://mvnrepository.com/artifact/commons-dbcp/commons-dbcp
    implementation group: 'commons-dbcp', name: 'commons-dbcp', version: '1.4'
// https://mvnrepository.com/artifact/org.springframework/spring-jdbc
    implementation group: 'org.springframework', name: 'spring-jdbc', version: '5.3.0'
}

test {
    useJUnitPlatform()
}